# REVERSE PROXY NGINX CONFIGURATION by Webinoly + Antigravity Integration

# 1. Proxy for Directus (Backend API & Authentication)
location /api/directus/ {
    proxy_pass https://api-builder.tinhgon.com/;
    proxy_set_header Host api-builder.tinhgon.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

